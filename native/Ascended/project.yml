name: Ascended
options:
  bundleIdPrefix: com.tonytuanngoc
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: HP5W6N9V3N
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '0.27.0'
    CURRENT_PROJECT_VERSION: '28'
    TARGETED_DEVICE_FAMILY: '2'
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
targets:
  Ascended:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tonytuanngoc.ascended
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ascended
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  AscendedTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Ascended
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Ascended.app/Ascended
        BUNDLE_LOADER: $(TEST_HOST)
  AscendedUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Ascended
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Ascended:
    build:
      targets:
        Ascended: all
    run:
      config: Debug
    test:
      targets: [AscendedTests, AscendedUITests]
